<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>購買｜正岡式としょんか</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="common.css">

<style>
body{
    padding-top:60px;
    background:#1c130c;
    color:#f0e4cf;
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    margin: 0;
}

h1{
    text-align:center;
    margin-bottom:30px;
    letter-spacing:0.2em;
}

/* ===== 全体レイアウト ===== */
.container{
  display:grid;
  grid-template-columns:240px 1fr 340px;
  height: calc(100vh - 60px);
  box-sizing: border-box;
}

/* 見出し共通 */
.section-header {
  font-size: 1.1em;
  font-weight: bold;
  color: #e5be75;
  border-bottom: 2px solid #8a633c;
  padding-bottom: 8px;
  margin-top: 0;
  margin-bottom: 16px;
  letter-spacing: 0.1em;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ===== 左側：商品案内板 (Sidebar) ===== */
.sidebar{
  background:#261b12;
  padding:20px 15px;
  border-right:2px solid #4a3421;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

#categoryList {
  flex-grow: 1;
  overflow-y: auto;
}

.category{
  padding:12px 14px;
  border:1px solid #73512f;
  background: #332317;
  color: #e6d8b8;
  margin-bottom:10px;
  border-radius: 4px;
  cursor:pointer;
  transition: all 0.2s;
  font-size: 0.95em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.category:hover{
  background:#473120;
  border-color: #e5be75;
  color: #fff;
  transform: translateX(3px);
}

.category.active {
  background: #5c3f28;
  border-color: #f2cb79;
  color: #f2cb79;
  font-weight: bold;
  box-shadow: inset 4px 0 0 #f2cb79;
}

.btn-reset {
  width:100%;
  padding:10px;
  background:#382619;
  color:#c7b299;
  border:1px solid #6b4b2a;
  border-radius: 4px;
  cursor:pointer;
  transition: background 0.2s;
}
.btn-reset:hover {
  background:#4a3421;
  color:#f2cb79;
}

/* ===== 中央：明るい陳列棚 (Main) ===== */
.main{ 
  padding:24px; 
  overflow-y:auto; 
  background: #23170e;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
  gap:18px;
}

/* 値札・棚の陳列カード風 */
.item{
  background:#faf4e8;
  color:#2b1d11;
  border:2px solid #a68150;
  border-radius: 6px;
  padding:14px;
  cursor:pointer;
  position:relative;
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 90px;
}

.item:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 16px rgba(0,0,0,0.5);
  border-color: #d9a752;
  background: #ffffff;
}

.item.selected{ 
  outline:3px solid #e6b141; 
  background: #fffdf5;
  border-color: #d9a752;
}

.item-name {
  font-weight: bold;
  font-size: 1.05em;
  border-bottom: 1px dashed #c4a67e;
  padding-bottom: 6px;
  margin-bottom: 8px;
  line-height: 1.3;
}

.item-price {
  text-align: right;
  font-size: 1em;
  font-weight: bold;
  color: #7a4e21;
}

.item-badge {
  display: inline-block;
  background: #8c5d2b;
  color: #fff;
  font-size: 0.8em;
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 4px;
}

.tooltip{
  position:absolute;
  bottom:100%;
  left:0;
  width: 100%;
  box-sizing: border-box;
  background:#2b1d11;
  color:#f0e4cf;
  border: 1px solid #d9a752;
  border-radius: 4px;
  padding:10px;
  font-size:12px;
  display:none;
  z-index: 10;
  box-shadow: 0 6px 14px rgba(0,0,0,0.6);
  pointer-events: none;
  line-height: 1.5;
  margin-bottom: 6px;
}
.item:hover .tooltip{ display:block; }

/* ===== 右側：レジ・お会計カウンター (Cart) ===== */
.cart{
  background:#2b1e14;
  padding:20px 16px;
  border-left:2px solid #4a3421;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

#cartList {
  flex-grow: 1;
  overflow-y: auto;
  border: 1px solid #63462b;
  border-radius: 4px;
  padding: 12px;
  background: #1f140c;
  margin-bottom: 16px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px dotted #4a3421;
  padding:8px 0;
  font-size: 0.95em;
}

.qty-btn{
  background:#473120;
  color:#f2cb79;
  border:1px solid #73512f;
  border-radius: 3px;
  padding:2px 8px;
  cursor:pointer;
  margin: 0 2px;
  font-weight: bold;
}
.qty-btn:hover {
  background: #61432c;
  border-color: #f2cb79;
}

.total-box {
  background: #362417;
  border: 1px solid #8a633c;
  border-radius: 4px;
  padding: 12px;
  margin-bottom: 14px;
  font-size: 1.05em;
  font-weight: bold;
  color: #f2cb79;
}

.btn-copy {
  width:100%;
  padding:12px;
  background:#8c5f30;
  color:#fff;
  border:1px solid #e5be75;
  border-radius: 4px;
  cursor:pointer;
  font-family: inherit;
  font-size: 1.05em;
  font-weight: bold;
  letter-spacing: 0.1em;
  transition: background 0.2s, transform 0.1s;
}
.btn-copy:hover {
  background:#a6733c;
  transform: translateY(-1px);
}
</style>
</head>

<body>
  
<div class="top-white-bar">
リンバスTRPG 正岡式としょんか
</div>

<nav class="global-nav">
  <a href="index.html">受付</a>
  <a href="database.html">資料室</a>
  <a href="trial.html">試用室</a>
  <a href="shop.html" class="active">購買</a>
  <a href="workshop.html">基礎室</a>
  <a href="help.html">案内板</a>
</nav>

<div class="help-wrapper">
<div class="container">

  <!-- 左：商品案内板 -->
  <div class="sidebar">
    <div class="section-header">
      <span>📁</span> 商品目録
    </div>
    <div id="categoryList"></div>
    <button class="btn-reset" onclick="resetAll()">全選択を解除</button>
  </div>

  <!-- 中央：陳列棚 -->
  <div class="main">
    <div class="grid" id="shop"></div>
  </div>

  <!-- 右：レジカウンター -->
  <div class="cart">
    <div class="section-header">
      <span>📜</span> 注文受渡伝票
    </div>
    <div id="cartList"></div>
    <div id="total" class="total-box"></div>
    <button class="btn-copy" onclick="copyResult()">注文内容をコピー</button>
  </div>

</div>
</div>

<script>
const TYPE_ORDER=["identity","ego","suppassive","mental","strengthening","item"];
const TYPE_LABEL={
  identity:"人格", ego:"E.G.O", suppassive:"サポートパッシブ",
  mental:"精神", strengthening:"身体強化", item:"アイテム", all:"すべて"
};

let ITEM_DB=[], cart=[], currentCategory="all";

/* 初期化 */
async function init(){
  const res=await fetch("./data/shop.tsv");
  const text=await res.text();
  ITEM_DB=parseTSV(text);
  load();
  renderCategories();
  renderShop();
  updateCart();
}

/* TSV解析 */
function parseTSV(tsv){
  const l=tsv.trim().split("\n");
  const h=l[0].split("\t");
  return l.slice(1).map((line,i)=>{
    const v=line.split("\t"); let r={};
    h.forEach((k,j)=>r[k]=v[j]);
    return {id:i,name:r["名称"],price:+r["値段"],unit:r["単位"],type:r["分類"],desc:r["概要"],source:r["出展"]};
  });
}

/* カテゴリ描画 */
function renderCategories(){
  categoryList.innerHTML="";
  const types=["all",...TYPE_ORDER.filter(t=>ITEM_DB.some(i=>i.type===t))];
  types.forEach(t=>{
    const d=document.createElement("div");
    d.className="category" + (currentCategory === t ? " active" : "");
    d.innerHTML=`<span>${TYPE_LABEL[t]||t}</span><span>›</span>`;
    d.onclick=()=>{
      currentCategory=t;
      renderCategories();
      renderShop();
    };
    categoryList.appendChild(d);
  });
}

/* 商品一覧描画 */
function renderShop(){
  shop.innerHTML="";
  ITEM_DB
    .slice().sort((a,b)=>TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type))
    .filter(i=>currentCategory==="all"||i.type===currentCategory)
    .forEach(item=>{
      const div=document.createElement("div");
      div.className="item";
      const inCart=cart.find(c=>c.id===item.id);
      if(inCart) div.classList.add("selected");
      
      const qtyBadge = inCart?.qty ? `<span class="item-badge">×${inCart.qty}</span>` : "";

      div.innerHTML=`
        <div class="tooltip">【概要】${item.desc}<br>【出展】${item.source}</div>
        <div class="item-name">${item.name}</div>
        <div class="item-price">${item.price} ${item.unit} ${qtyBadge}</div>
      `;
      div.onclick=()=>toggle(item);
      shop.appendChild(div);
    });
}

/* 追加/削除 */
function toggle(item){
  const f=cart.find(i=>i.id===item.id);
  if(item.type==="item"){
    if(f) f.qty++; else cart.push({...item,qty:1});
  }else{
    if(f) cart=cart.filter(i=>i.id!==item.id);
    else cart.push({...item});
  }
  save(); renderShop(); updateCart();
}

/* ＋ − */
function addQty(id){
  const i=cart.find(x=>x.id===id); if(i){i.qty++;save();updateCart();renderShop();}
}
function subQty(id){
  const i=cart.find(x=>x.id===id);
  if(!i) return;
  if(i.qty>1) i.qty--;
  else cart=cart.filter(x=>x.id!==id);
  save(); updateCart(); renderShop();
}

/* 合計計算 */
function calcTotal(){
  const t={};
  cart.forEach(i=>{
    const q=i.qty||1;
    t[i.unit]=(t[i.unit]||0)+i.price*q;
  });
  return t;
}

/* カート表示更新 */
function updateCart(){
  cartList.innerHTML="";
  if(cart.length === 0){
    cartList.innerHTML = `<div style="color:#8a633c; text-align:center; padding-top:30px; font-size:0.9em;">選択された商品はありません</div>`;
  } else {
    cart.forEach(i=>{
      const q=i.qty||1;
      const d=document.createElement("div");
      d.className="cart-item";

      if(i.type==="item"){
        d.innerHTML=`
          <span>${i.name} (${i.price*q}${i.unit})</span>
          <span>
            <button class="qty-btn" onclick="subQty(${i.id})">−</button>
            ${q}
            <button class="qty-btn" onclick="addQty(${i.id})">＋</button>
          </span>
        `;
      }else{
        d.innerHTML=`<span>${i.name} (${i.price}${i.unit})</span>
          <button class="qty-btn" onclick="subQty(${i.id})">×</button>`;
      }
      cartList.appendChild(d);
    });
  }

  const t=calcTotal();
  total.innerHTML="";
  const keys = Object.keys(t);
  if(keys.length === 0){
    total.innerHTML = `<span style="color:#8a633c;">合計： 0</span>`;
  } else {
    keys.forEach(u=>{
      const d=document.createElement("div");
      d.textContent=`合計 (${u}) : ${t[u]}`;
      total.appendChild(d);
    });
  }
}

/* コピー */
function copyResult(){
  if(cart.length === 0) {
    alert("注文する商品が選択されていません");
    return;
  }
  let txt="";
  cart.forEach(i=>{
    const q=i.qty||1;
    txt+=`${i.name}\t${i.price}×${q}${i.unit}\n`;
  });
  txt+="\n【合計】\n";
  const t=calcTotal();
  Object.keys(t).forEach(u=>txt+=`${u}\t${t[u]}\n`);
  navigator.clipboard.writeText(txt);
  alert("注文内容をクリップボードにコピーしました");
}

function save(){localStorage.setItem("cart",JSON.stringify(cart));}
function load(){const d=localStorage.getItem("cart"); if(d) cart=JSON.parse(d);}
function resetAll(){cart=[];localStorage.clear();renderCategories();renderShop();updateCart();}

init();
</script>
</body>
</html>
